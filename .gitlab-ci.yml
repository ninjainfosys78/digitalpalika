stages:
  - build
  - deploy

variables:
  NODE_VERSION: "22"
  PROJECT_NAME: "epalika-landing"  # Update with your Cloudflare Pages project name
  BUILD_DIR: "out"
  NPM_CONFIG_CACHE: "$CI_PROJECT_DIR/.npm"
  NEXT_TELEMETRY_DISABLED: "1"

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - node_modules/
    - .npm/
    - .next/cache/

build:
  stage: build
  image: node:${NODE_VERSION}-alpine
  # tags:
  #   - numanode
  before_script:
    - echo "Installing dependencies..."
    - npm install --cache .npm --prefer-offline --no-audit --legacy-peer-deps
  script:
    - echo "Building Next.js project..."
    - npm run build
    - ls -la ${BUILD_DIR}/
  artifacts:
    paths:
      - ${BUILD_DIR}/
    expire_in: 1 day
  only:
    - branches

deploy:preview:
  stage: deploy
  image: node:${NODE_VERSION}-alpine
  # tags:
  #   - numanode
  dependencies:
    - build
  before_script:
    - npm install -g wrangler@latest
  script:
    - echo "Deploying preview..."
    - wrangler pages deploy ${BUILD_DIR} --project-name=${PROJECT_NAME} --branch=${CI_COMMIT_REF_NAME} --commit-hash=${CI_COMMIT_SHA}
    - echo "Preview URL https://${CI_COMMIT_SHORT_SHA}.preview.ninjainfosys.com"
  environment:
    name: preview/$CI_COMMIT_REF_SLUG
    url: https://${CI_COMMIT_SHORT_SHA}.preview.ninjainfosys.com
  rules:
    - if: $CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != "main" && $CI_COMMIT_BRANCH != "master"

deploy:production:
  stage: deploy
  image: node:${NODE_VERSION}-trixie
  # tags:
  # - numanode
  dependencies:
    - build
  before_script:
    - npm install -g wrangler@latest
  script:
    - echo "Deploying to production..."
    - wrangler pages deploy ${BUILD_DIR} --project-name=${PROJECT_NAME} --branch=main
    - echo "Live at https://ninjainfosys.com"
  environment:
    name: production
    url: https://ninjainfosys.com
  rules:
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "master"
