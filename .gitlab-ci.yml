# GitLab CI/CD Pipeline for Next.js Landing Page
# Deploys to Cloudflare Pages with preview environments

stages:
  - build
  - deploy

variables:
  NODE_VERSION: "20"
  PROJECT_NAME: "ninjainfosys"
  # Next.js static export outputs to 'out' directory
  BUILD_DIR: "out"
  NPM_CONFIG_CACHE: "$CI_PROJECT_DIR/.npm"
  NEXT_TELEMETRY_DISABLED: "1"

# Cache dependencies for faster builds
cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - node_modules/
    - .npm/
    - .next/cache/

# ========================================
# BUILD STAGE - Build Next.js static site
# ========================================
build:
  stage: build
  image: node:${NODE_VERSION}-alpine
  tags:
    - doit-suryabinayak-nepal
  
  before_script:
    - echo "📦 Installing dependencies..."
    - echo "Using npm (package-lock.json found)"
    - npm ci --cache .npm --prefer-offline --no-audit
  
  script:
    - echo "🔨 Building Next.js project..."
    - echo "📍 Project: ninja-infosys/landing-page"
    - echo "📝 Commit: ${CI_COMMIT_SHORT_SHA}"
    - echo "🌿 Branch: ${CI_COMMIT_REF_NAME}"
    
    # Build Next.js with static export
    - npm run build
    
    # Verify build output
    - echo ""
    - echo "✅ Build complete! Checking output..."
    - ls -la ${BUILD_DIR}/ || echo "⚠️  Warning: ${BUILD_DIR} not found - checking .next/standalone"
    - echo ""
    - echo "📊 Build size:"
    - du -sh ${BUILD_DIR}/ 2>/dev/null || du -sh .next/ || echo "Could not determine size"
  
  artifacts:
    paths:
      - ${BUILD_DIR}/
    expire_in: 1 day
    when: on_success
  
  only:
    - branches
    - merge_requests
    - tags

# ========================================
# DEPLOY PREVIEW - Feature branches
# ========================================
deploy:preview:
  stage: deploy
  image: node:${NODE_VERSION}-alpine
  tags:
    - doit-suryabinayak-nepal
  
  dependencies:
    - build
  
  before_script:
    - echo "📥 Installing Wrangler CLI..."
    - npm install -g wrangler@latest
    - wrangler --version
  
  script:
    - echo "🚀 Deploying preview environment..."
    - echo "📦 Project: ${PROJECT_NAME}"
    - echo "🌿 Branch: ${CI_COMMIT_REF_NAME}"
    - echo "📝 Commit: ${CI_COMMIT_SHORT_SHA}"
    - echo "👤 Author: ${CI_COMMIT_AUTHOR}"
    - echo ""
    
    # Deploy to Cloudflare Pages
    - wrangler pages deploy ${BUILD_DIR}
        --project-name=${PROJECT_NAME}
        --branch=${CI_COMMIT_REF_NAME}
        --commit-hash=${CI_COMMIT_SHA}
        --commit-message="${CI_COMMIT_MESSAGE}"
    
    # Generate preview URL
    - export PREVIEW_URL="${CI_COMMIT_SHORT_SHA}.preview.ninjainfosys.com"
    - echo ""
    - echo "=========================================="
    - echo "✅ Preview Deployed Successfully!"
    - echo "=========================================="
    - echo "🔗 Preview URL: https://${PREVIEW_URL}"
    - echo "📦 Branch: ${CI_COMMIT_REF_NAME}"
    - echo "📝 Commit: ${CI_COMMIT_SHORT_SHA}"
    - echo "📅 Time: $(date)"
    - echo "=========================================="
    - echo ""
    - echo "💡 This preview will be available for 7 days"
  
  environment:
    name: preview/$CI_COMMIT_REF_SLUG
    url: https://${CI_COMMIT_SHORT_SHA}.preview.ninjainfosys.com
    on_stop: stop:preview
    auto_stop_in: 7 days
  
  # Deploy previews for all branches EXCEPT main/master
  rules:
    - if: $CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != "main" && $CI_COMMIT_BRANCH != "master"
      when: on_success

# ========================================
# DEPLOY PRODUCTION - Main branch only
# ========================================
deploy:production:
  stage: deploy
  image: node:${NODE_VERSION}-alpine
  tags:
    - doit-suryabinayak-nepal
  
  dependencies:
    - build
  
  before_script:
    - echo "📥 Installing Wrangler CLI..."
    - npm install -g wrangler@latest
    - wrangler --version
  
  script:
    - echo "🚀 Deploying to PRODUCTION..."
    - echo "📦 Project: ${PROJECT_NAME}"
    - echo "📝 Commit: ${CI_COMMIT_SHA}"
    - echo "👤 Author: ${CI_COMMIT_AUTHOR}"
    - echo ""
    
    # Deploy to production
    - wrangler pages deploy ${BUILD_DIR}
        --project-name=${PROJECT_NAME}
        --branch=main
        --commit-hash=${CI_COMMIT_SHA}
        --commit-message="${CI_COMMIT_MESSAGE}"
    
    - echo ""
    - echo "=========================================="
    - echo "✅ Production Deployed Successfully!"
    - echo "=========================================="
    - echo "🌐 Live at: https://ninjainfosys.com"
    - echo "🔗 Pages URL: https://${PROJECT_NAME}.pages.dev"
    - echo "📝 Commit: ${CI_COMMIT_SHA}"
    - echo "📅 Time: $(date)"
    - echo "=========================================="
  
  environment:
    name: production
    url: https://ninjainfosys.com
  
  # Only deploy to production from main branch
  rules:
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "master"
      when: on_success

# ========================================
# STOP PREVIEW - Cleanup when branch deleted
# ========================================
stop:preview:
  stage: deploy
  image: alpine:latest
  tags:
    - doit-suryabinayak-nepal
  
  script:
    - echo "🧹 Preview environment cleanup"
    - echo "Branch ${CI_COMMIT_REF_NAME} has been merged/deleted"
    - echo "Cloudflare will automatically archive old deployments"
  
  environment:
    name: preview/$CI_COMMIT_REF_SLUG
    action: stop
  
  rules:
    - if: $CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != "main" && $CI_COMMIT_BRANCH != "master"
      when: manual
  
  allow_failure: true
